<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d7d0b8" />
    <meta
      name="description"
      content="Mostly Alive Plants — a cozy 3D plant shop game for the browser."
    />
    <title>Mostly Alive Plants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="title-screen" aria-labelledby="game-title">
      <div class="sun-glow" aria-hidden="true"></div>
      <div class="leaf leaf-one" aria-hidden="true"></div>
      <div class="leaf leaf-two" aria-hidden="true"></div>
      <div class="leaf leaf-three" aria-hidden="true"></div>

      <section class="title-card">
        <p class="eyebrow">A tiny shopkeeping game</p>
        <h1 id="game-title">
          <span>Mostly Alive</span>
          <span class="title-accent">Plants</span>
        </h1>
        <p class="tagline">
          Rescue peculiar plants, match them with peculiar people, and try not to
          overwater the inventory.
        </p>
        <button class="primary-button" type="button" disabled aria-describedby="status">
          Open the shop
          <span aria-hidden="true">↗</span>
        </button>
        <p id="status" class="status">The shutters are coming up…</p>
      </section>

      <footer>
        <span>Day 01</span>
        <span>Est. whenever you arrived</span>
      </footer>
    </main>
  </body>
</html>
